# Compliance Rules Configuration — Phase 2
# Defines validation rules for each document type
# Used by src/validation/rule_engine.py

sop:
  required_fields:
    - title
    - version
    - effective_date
    - owner
    - department
    - approval_date
    - review_cycle
  
  field_rules:
    title:
      min_length: 5
      max_length: 200
    
    version:
      pattern: "^[0-9]+\\.[0-9]+$"
    
    effective_date:
      must_not_be_future: true
    
    approval_date:
      must_not_be_future: true
      must_be_before: effective_date
    
    review_cycle:
      allowed_values:
        - Annual
        - Semi-annual
        - Quarterly
        - Biennial
        - Monthly

adverse_event:
  required_fields:
    - event_id
    - date_reported
    - product_id
    - batch_id
    - severity
    - description
    - reporter
    - follow_up_status
  
  field_rules:
    event_id:
      pattern: "^AE-[0-9]{4}-[0-9]{5}$"
    
    date_reported:
      must_not_be_future: true
    
    product_id:
      pattern: "^PROD-[A-Z][0-9]{4}$"
    
    batch_id:
      pattern: "^BATCH-[0-9]{6}$"
    
    severity:
      allowed_values:
        - critical
        - high
        - medium
        - low
        - info
    
    follow_up_status:
      allowed_values:
        - open
        - in_progress
        - closed
        - pending_review
    
    description:
      min_length: 10
      max_length: 5000

audit_finding:
  required_fields:
    - audit_id
    - audit_date
    - finding_category
    - severity
    - description
    - corrective_action
    - due_date
    - responsible_party
  
  field_rules:
    audit_id:
      pattern: "^AUD-[0-9]{4}-[0-9]{5}$"
    
    audit_date:
      must_not_be_future: true
    
    severity:
      allowed_values:
        - critical
        - high
        - medium
        - low
    
    due_date:
      must_be_after: audit_date
    
    finding_category:
      allowed_values:
        - Documentation
        - Facility
        - Process
        - Personnel Training
        - Equipment Maintenance
        - Data Integrity
        - Supplier Management
        - Change Control
        - CAPA Effectiveness
    
    description:
      min_length: 10
      max_length: 5000
    
    corrective_action:
      min_length: 5
      max_length: 2000
